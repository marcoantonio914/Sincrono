<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <title>Sincrono - Partitura</title>
    <style>
      body { padding-bottom: 8px; background: transparent; min-height: 0; }
      main { width: 100%; padding: 0; }
      #score { border: 0; padding: 0; background: transparent; }
      #score h2 { display: none; }
      #score-view, #score-view.pages { height: calc(100vh - 118px); min-height: 160px; }
      body.stage-page #score-view, body.stage-page #score-view.pages { height: calc(100vh - 56px); }
      body.stage-page #score-info, body.stage-page #score-timeline, body.stage-page #score-marks, body.stage-page #marks-bar, body.stage-page #score-part, body.stage-page #score-stage { display: none !important; }
      body.stage-page #score-view, body.stage-page #score-view.pages { height: 100vh; }
      body.stage-page .row.tb { position: fixed; top: 8px; left: 8px; z-index: 60; display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div class="tab" data-tab="score">
      <section id="score" class="offset" aria-label="Partitura" hidden>
        <h2>Partitura</h2>
        <div class="row tb">
          <select id="score-part" class="grow" aria-label="Minha parte"></select>
          <button id="score-mode" type="button" class="rbtn" title="Visualização (toque para trocar)" aria-label="Visualização"></button>
          <button id="score-zoom-out" type="button" class="rbtn" aria-label="Diminuir" title="Diminuir">A−</button>
          <button id="score-zoom-in" type="button" class="rbtn" aria-label="Aumentar" title="Aumentar">A+</button>
        </div>
        <div id="score-timeline" class="row" hidden>
          <input id="score-seek" class="grow" type="range" min="0" max="1000" value="0" aria-label="Linha do tempo da partitura">
          <span id="score-seek-label" class="muted">compasso 1</span>
        </div>
        <div id="score-marks" class="row" hidden>
          <button id="marks-start" type="button" title="Toque o áudio e marque o início de cada compasso">Marcar compassos</button>
          <button id="marks-clear" type="button" hidden>Apagar marcadores</button>
          <span id="marks-status" class="muted"></span>
        </div>
        <div id="marks-bar" class="row" hidden>
          <button id="marks-tap" type="button" class="primary big grow">COMPASSO</button>
          <button id="marks-undo" type="button">Desfazer</button>
          <button id="marks-save" type="button">Salvar</button>
          <button id="marks-cancel" type="button">Cancelar</button>
          <label class="muted">Atraso do toque (ms) <input id="marks-delay" type="number" min="0" max="500" value="120" style="width:5em"></label>
        </div>
        <div id="score-grp" class="gchip" hidden></div>
        <span id="score-verse" class="gchip verse" hidden></span>
        <div id="score-view" tabindex="0" aria-label="Partitura com cursor"></div>
        <p id="score-info" class="muted" aria-live="polite"></p>
      </section>
      </div>
    </main>
    <!-- No app, o relógio, o metrônomo e o áudio são nativos: o app empurra os valores (sincronoTick) a cada 50 ms. -->
    <script>
      let songGroup = 'g1';
      let songState = null;
      let state = { playing: false, bpm: 120, beatsPerBar: 4, startAt: 1, revision: 0 };
      let nativeElapsed = 0, nativeAudio = null;
      function serverNow() { return nativeElapsed + 1; }
      function songPositionMs() { return nativeAudio === null ? 0 : nativeAudio; }
      window.sincronoTick = function (t) {
        if (!t) return;
        songGroup = t.group || 'g1';
        nativeAudio = (typeof t.audio === 'number') ? t.audio : null;
        songState = nativeAudio === null ? null : { file: { id: 1, name: t.audioName || '' }, playing: !!t.audioPlaying, positionMs: nativeAudio, startAt: 0, stopAt: null };
        const metro = (typeof t.metro === 'number');
        nativeElapsed = metro ? t.metro : 0;
        state = { playing: metro, bpm: t.bpm || 120, beatsPerBar: t.beats || 4, startAt: 1, revision: 0, silent: !!t.silent };
        if (typeof t.now === 'number') { realNowAt = t.now; realNowStamp = performance.now(); }
      };
      // relógio REAL do servidor (o serverNow acima é só o tempo do metrônomo): usado pelo anfitrião ao mover a música
      let realNowAt = 0, realNowStamp = 0;
      window.sincronoServerNow = () => realNowAt + (performance.now() - realNowStamp);
      if (/[?&]stage=1/.test(location.search)) document.body.classList.add('stage-page');
      document.body.classList.add('guest');
    </script>
    <script src="/groupcolor.js"></script>
    <script src="/score.js"></script>
    <script src="/score-view.js"></script>
    <script src="/score-panel.js"></script>
  </body>
</html>
