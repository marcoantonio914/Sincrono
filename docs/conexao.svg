<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="680" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Como os aparelhos se conectam no Sincrono</text>
  <text x="500" y="64" text-anchor="middle" font-size="14" fill="#475569">Tudo na mesma rede Wi-Fi do local. Não precisa de internet.</text>

  <!-- Wi-Fi -->
  <ellipse cx="500" cy="350" rx="490" ry="270" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="112" text-anchor="middle" font-size="13" fill="#0369a1">rede Wi-Fi local</text>

  <!-- roteador -->
  <g transform="translate(500 330)">
    <rect x="-70" y="-22" width="140" height="44" rx="12" fill="#111827"/>
    <circle cx="-44" cy="0" r="4" fill="#4ade80"/><circle cx="-30" cy="0" r="4" fill="#4ade80"/><circle cx="-16" cy="0" r="4" fill="#4ade80"/>
    <path d="M-30 -28 L-48 -66 M30 -28 L48 -66" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <path d="M-16 -86 a30 30 0 0 1 32 0 M-30 -100 a50 50 0 0 1 60 0" stroke="#0284c7" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(0 6)"/>
    <text y="-124" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Roteador</text>
  </g>

  <!-- computador anfitrião -->
  <g transform="translate(150 330)">
    <rect x="-70" y="-50" width="140" height="90" rx="8" fill="#fff" stroke="#111827" stroke-width="4"/>
    <rect x="-58" y="-38" width="116" height="66" rx="3" fill="#111827"/>
    <path d="M-30 -10 h60 M-30 4 h40 M-30 18 h50" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
    <path d="M-90 52 h180 l-14 -12 h-152z" fill="#cbd5e1" stroke="#111827" stroke-width="3"/>
    <text y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Computador</text>
    <text y="100" text-anchor="middle" font-size="13" fill="#475569">anfitrião (servidor Python)</text>
  </g>

  <!-- celular anfitrião (alternativa) -->
  <g transform="translate(850 330)">
    <rect x="-34" y="-62" width="68" height="124" rx="12" fill="#fff" stroke="#111827" stroke-width="4"/>
    <rect x="-26" y="-48" width="52" height="88" rx="3" fill="#111827"/>
    <text y="-8" text-anchor="middle" font-size="26" fill="#4ade80">♪</text>
    <text y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Celular anfitrião</text>
    <text y="104" text-anchor="middle" font-size="13" fill="#475569">(ou este, no lugar do PC)</text>
  </g>

  <!-- clientes -->
  <g id="cel">
    <g transform="translate(300 540)"><rect x="-26" y="-46" width="52" height="92" rx="10" fill="#fff" stroke="#111827" stroke-width="3.5"/><rect x="-19" y="-34" width="38" height="62" rx="2" fill="#1d4ed8"/><text y="12" text-anchor="middle" font-size="20" fill="#fff">♪</text></g>
    <g transform="translate(420 570)"><rect x="-26" y="-46" width="52" height="92" rx="10" fill="#fff" stroke="#111827" stroke-width="3.5"/><rect x="-19" y="-34" width="38" height="62" rx="2" fill="#1d4ed8"/><text y="12" text-anchor="middle" font-size="20" fill="#fff">♪</text></g>
    <g transform="translate(580 570)"><rect x="-26" y="-46" width="52" height="92" rx="10" fill="#fff" stroke="#111827" stroke-width="3.5"/><rect x="-19" y="-34" width="38" height="62" rx="2" fill="#b45309"/><text y="12" text-anchor="middle" font-size="20" fill="#fff">♪</text></g>
    <g transform="translate(700 540)"><rect x="-26" y="-46" width="52" height="92" rx="10" fill="#fff" stroke="#111827" stroke-width="3.5"/><rect x="-19" y="-34" width="38" height="62" rx="2" fill="#b45309"/><text y="12" text-anchor="middle" font-size="20" fill="#fff">♪</text></g>
  </g>
  <text x="360" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Grupo A (ex.: vozes)</text>
  <text x="640" y="656" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Grupo B (ex.: violões)</text>

  <!-- setas -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M235 330 H428"/>
    <path d="M772 330 H572" stroke-dasharray="6 5"/>
    <path d="M470 366 L330 500"/>
    <path d="M492 372 L430 520"/>
    <path d="M508 372 L570 520"/>
    <path d="M530 366 L670 500"/>
  </g>

  <!-- legenda -->
  <rect x="40" y="86" width="270" height="96" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="54" y="108" font-size="13" font-weight="700" fill="#111827">O que trafega pela rede</text>
  <text x="54" y="128" font-size="12" fill="#334155">1. Relógio comum (estilo NTP)</text>
  <text x="54" y="146" font-size="12" fill="#334155">2. Comandos: "começa em tal instante"</text>
  <text x="54" y="164" font-size="12" fill="#334155">3. Arquivos (áudio, partitura): 1 vez</text>

  <rect x="690" y="86" width="270" height="96" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="704" y="108" font-size="13" font-weight="700" fill="#111827">Cada aparelho</text>
  <text x="704" y="128" font-size="12" fill="#334155">toca o som no próprio alto-falante/fone</text>
  <text x="704" y="146" font-size="12" fill="#334155">e mostra a sua parte da partitura.</text>
  <text x="704" y="164" font-size="12" fill="#334155">Nada de áudio ao vivo pela rede.</text>
</svg>
